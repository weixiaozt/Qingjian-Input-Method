[package]
name = "wubi-sentence-lab"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace]

[dependencies]
qingjian-core = { path = "../../crates/qingjian-core" }
qingjian-lm = { path = "../../crates/qingjian-lm" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
uuid = { version = "1.26", features = ["v4"] }

[profile.release]
opt-level = 3
strip = true

[[bin]]
name = "wubi-lab"
path = "src/main.rs"
